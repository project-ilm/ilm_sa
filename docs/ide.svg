<text x="32" y="118" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">#अन्तर्भाव &lt;stdio.h&gt;</text>
<text x="32" y="139" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* क्रमबद्धायां सूच्यां द्विमान अन्वेषणम् */</text>
<text x="32" y="160" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">पूर्णाङ्क द्विमान_अन्वेषणम्(पूर्णाङ्क मानानि[], पूर्णाङ्क गणनम्, पूर्णाङ्क कुञ्चिका) {</text>
<text x="32" y="181" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  पूर्णाङ्क नीचः = 0, उच्चः = गणनम् - 1;</text>
<text x="32" y="202" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  यावत् (नीचः &lt;= उच्चः) {</text>
<text x="32" y="223" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    पूर्णाङ्क मध्यः = नीचः + (उच्चः - नीचः) / 2;</text>
<text x="32" y="244" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    यदि (मानानि[मध्यः] == कुञ्चिका) प्रत्यागम मध्यः;</text>
<text x="32" y="265" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    यदि (मानानि[मध्यः] &lt; कुञ्चिका) नीचः = मध्यः + 1; अन्यथा उच्चः = मध्यः - 1;</text>
<text x="32" y="286" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="32" y="307" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  प्रत्यागम -1;</text>
<text x="32" y="328" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="32" y="349" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">पूर्णाङ्क मुख्यम्(शून्य) {</text>
</svg>